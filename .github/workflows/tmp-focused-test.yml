name: Temporary Focused Python Test

on:
  push:
    branches:
      - feature/studio-v2-plan-and-verified-render

jobs:
  test-render-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2 --quiet
      - run: PYTHONPATH=fastapi pytest -q fastapi/tests/test_render_verifier.py
