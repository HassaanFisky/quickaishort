name: Temporary Black Diff Oracle

on:
  push:
    branches:
      - feature/studio-v2-plan-and-verified-render

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "black==26.5.1" --quiet
      - run: black --diff fastapi/render_worker.py fastapi/services/render_verifier.py fastapi/tests/test_render_verifier.py || true
